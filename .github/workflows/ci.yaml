name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deye_monitor
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -W error

  broker:
    # Real Mosquitto (Docker, loopback, random port): retain, will at a hard end, restart, birth
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deye_monitor
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run pytest -m broker -W error

  ui:
    # Browser end-to-end tests of the Ingress UI (Playwright with Chromium)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deye_monitor
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m ui -W error
        env:
          DEYE_UI_REQUIRED: "1"  # no browser must fail this job, not skip it

  ha-schema:
    # Separate environment with Home Assistant Core 2026.10.4 (never part of the app image)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ha-schema-tests
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run pytest -q

  lint-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Home Assistant app linter
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./deye_monitor

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image (context is the app directory only)
        uses: docker/build-push-action@v7.4.0
        with:
          context: deye_monitor
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
          load: true
          push: false
          tags: deye-monitor:ci
      - name: Label check (app identity, base provenance kept apart)
        run: python3 deye_monitor/tests/check_image_labels.py deye-monitor:ci ${{ matrix.arch }}
      - name: Import check
        run: >
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python deye-monitor:ci
          -c "import deye_monitor; print(deye_monitor.__version__)"
      - name: Start with fake options, then SIGTERM
        run: |
          docker run -d --name dm --platform ${{ matrix.platform }} \
            -e DEYE_MONITOR_NO_DEVICES=1 \
            -v "$PWD/.github/fixtures/options.json:/data/options.json:ro" deye-monitor:ci
          for _ in $(seq 1 60); do
            docker logs dm 2>&1 | grep -q "ready:" && break
            sleep 1
          done
          docker logs dm
          docker logs dm 2>&1 | grep -q "ready:"
          docker stop -t 30 dm
          test "$(docker inspect dm --format '{{.State.ExitCode}}')" = "0"
