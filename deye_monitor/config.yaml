name: "Deye SG04LP3 Monitor"
version: "0.1.0"
slug: "deye_monitor"
description: "Read-only monitoring of Deye SUN-xK-SG04LP3 inverters via MQTT discovery"
url: "https://github.com/privatecoder/deye-sg04lp3-ha-addon"
arch:
  - aarch64
  - amd64
init: false
stage: experimental
startup: application
boot: auto
services:
  - mqtt:want
# Static manifest permission (no runtime condition): only the serial_device paths configured by
# the user are ever opened, nothing is scanned. See DOCS.md.
uart: true
# Read-only access to /ssl: only for the optional TLS files of an external MQTT broker
# (mqtt.tls_ca_file / tls_certfile / tls_keyfile). Nothing is read from /ssl otherwise.
map:
  - ssl:ro
ingress: true
panel_admin: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: "Deye Monitor"
options:
  endpoints: []
  inverters: []
  mqtt:
    discovery_prefix: homeassistant
    topic_prefix: deye_monitor
  log_level: info
schema:
  endpoints:
    - id: "match(^[a-z0-9_]{1,32}$)"
      transport: "list(modbus_tcp|rtu_over_tcp|serial_rtu|solarman_v5_tcp)"
      host: "str?"
      port: "int(1,65535)?"
      logger_serial: "int(1,4294967295)?"
      serial_device: "str?"
      baudrate: "int(50,4000000)?"
      bus_id: "match(^[a-z0-9_]{1,32}$)?"
      timeout_s: "float(0.1,)?"
      rtu_late_window_s: "float(0.1,)?"
      max_read_registers: "int(6,100)?"
      request_gap_ms: "float(0,)?"
      queue_size: "int(1,1000)?"
  inverters:
    - id: "match(^[a-z0-9_]{1,32}$)"
      name: "str"
      endpoint: "match(^[a-z0-9_]{1,32}$)"
      unit_id: "int(1,247)"
      fallback_endpoint: "match(^[a-z0-9_]{1,32}$)?"
      fallback_unit_id: "int(1,247)?"
      expected_serial: "match(^[!-~][ -~]{8}[!-~]$)?"
      profile: "str?"
      energy_resolution: "list(auto|0.1|1)?"
      poll_fast_s: "float(1,)?"
      poll_energy_s: "float(1,)?"
      poll_settings_s: "float(1,)?"
      poll_identity_s: "float(1,)?"
      allow_writes: "bool?"
  # A nested mapping is REQUIRED by the Supervisor (only "?" strings are optional), so every
  # configuration must keep an `mqtt:` block (it may be `mqtt: {}`); the defaults below provide it.
  mqtt:
    host: "str?"
    port: "int(1,65535)?"
    username: "str?"
    password: "password?"
    tls: "bool?"
    tls_ca_file: "str?"
    tls_certfile: "str?"
    tls_keyfile: "str?"
    discovery_prefix: "str?"
    topic_prefix: "str?"
    birth_topic: "str?"
  log_level: "list(debug|info|warning|error)?"
  instance_id: "match(^[a-z0-9]{4,16}$)?"
