configuration:
  mqtt:
    name: MQTT
    description: Host leer lassen, um den MQTT-Dienst von Home Assistant zu nutzen.
    fields:
      host:
        name: Host
        description: Broker-Host. Leer = MQTT-Dienst von Home Assistant.
      port:
        name: Port
        description: Broker-Port. Standard 1883.
      username:
        name: Benutzername
        description: Benutzername am Broker.
      password:
        name: Passwort
        description: Passwort am Broker.
      tls:
        name: TLS
        description: TLS für die Broker-Verbindung verwenden.
      tls_ca_file:
        name: "TLS-CA-Datei"
        description: "Pfad der CA-Zertifikatsdatei (PEM), die das Broker-Zertifikat signiert hat, unterhalb von /ssl (z. B. /ssl/mqtt-ca.pem). Leer = System-Vertrauensspeicher. Serverzertifikat und Hostname werden immer geprüft."
      tls_certfile:
        name: "TLS-Clientzertifikat"
        description: "Optionales Clientzertifikat (PEM) unterhalb von /ssl für Broker, die eines verlangen. Benötigt zusätzlich die Schlüsseldatei."
      tls_keyfile:
        name: "TLS-Client-Schlüssel"
        description: "Optionaler privater Schlüssel (PEM) des Clientzertifikats, unterhalb von /ssl."
      discovery_prefix:
        name: Discovery-Präfix
        description: MQTT-Discovery-Präfix von Home Assistant. Standard homeassistant.
      topic_prefix:
        name: Topic-Präfix
        description: Präfix für State- und Availability-Topics. Standard deye_monitor.
      birth_topic:
        name: "Birth-Topic"
        description: "Topic der Home-Assistant-Birth-Nachricht (\"online\"). Bei Eingang stellt die App ihre Discovery-Daten erneut bereit. Standard homeassistant/status."
  log_level:
    name: Log-Level
    description: Ausführlichkeit des App-Logs.
  instance_id:
    name: Instanz-ID
    description: Optional. Pro Installation eindeutig (4-16 Zeichen a-z, 0-9); wird bei leerem Wert automatisch
      erzeugt und gespeichert.
