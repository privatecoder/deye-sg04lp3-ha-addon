configuration:
  mqtt:
    name: MQTT
    description: Leave the host empty to use the Home Assistant MQTT service.
    fields:
      host:
        name: Host
        description: Broker host. Empty = Home Assistant MQTT service.
      port:
        name: Port
        description: Broker port. Default 1883.
      username:
        name: Username
        description: Broker user name.
      password:
        name: Password
        description: Broker password.
      tls:
        name: TLS
        description: Use TLS for the broker connection.
      tls_ca_file:
        name: "TLS CA file"
        description: "Path of the CA certificate (PEM) that signed the broker certificate, below /ssl (for example /ssl/mqtt-ca.pem). Empty = system trust store. The server certificate and host name are always verified."
      tls_certfile:
        name: "TLS client certificate"
        description: "Optional client certificate (PEM) below /ssl for brokers that require one. Needs the key file as well."
      tls_keyfile:
        name: "TLS client key"
        description: "Optional private key (PEM) of the client certificate, below /ssl."
      discovery_prefix:
        name: Discovery prefix
        description: MQTT discovery prefix of Home Assistant. Default homeassistant.
      topic_prefix:
        name: Topic prefix
        description: Prefix for state and availability topics. Default deye_monitor.
      birth_topic:
        name: "Birth topic"
        description: "Topic of the Home Assistant birth message (\"online\"). When it arrives the app offers its discovery data again. Default homeassistant/status."
  log_level:
    name: Log level
    description: Verbosity of the app log.
  instance_id:
    name: Instance ID
    description: Optional. Unique per installation (4-16 of a-z, 0-9); generated and stored automatically
      if empty.
